# Plantilla: la imagen oficial sustituye ${API_UPSTREAM} al arrancar (NGINX_ENVSUBST_FILTER).
server_tokens off;

# Rate limit simple por IP para la API (las corridas además las limita el backend: GMAT_WEB_MAX_RUNS).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Scripts de hasta GMAT_WEB_MAX_SCRIPT_BYTES (512 KiB) más el JSON que los envuelve.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El WebSocket de una corrida vive hasta GMAT_WEB_RUN_TIMEOUT (300 s por defecto).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Archivos con hash: caché larga. Cesium no lleva hash: caché corta.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /cesium/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
